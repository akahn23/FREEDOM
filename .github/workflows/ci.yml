name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -r requirements.txt
          pip install --group dev
      - name: ruff check
        run: ruff check src
      - name: mypy
        run: mypy src

  frontend:
    name: Frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder so Better Auth doesn't complain during the build; not a real secret.
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` rejects the lockfile because of the `sharp` -> empty-module override,
      # so install from the lockfile with `npm install` instead.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: next build
        run: npm run build
