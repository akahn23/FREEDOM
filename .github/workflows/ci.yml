name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versions pinned in docs/install.md (Python 3.13.3, Node.js v24.18.0)
  PYTHON_VERSION: "3.13.3"
  NODE_VERSION: "24.18.0"

jobs:
  backend-pytest:
    name: Backend / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The pytest suite may not be merged yet; skip (green) until it exists.
      - name: Detect pytest suite
        id: detect
        run: |
          if [ -f requirements-dev.txt ] && [ -d tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=pytest skipped::backend/requirements-dev.txt or backend/tests/ not found"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # backend/requirements.txt is UTF-16LE with CRLF line endings; normalise before pip.
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          iconv -f UTF-16 -t UTF-8 requirements.txt | tr -d '\r' > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements.txt" -r requirements-dev.txt

      - name: Run pytest
        if: steps.detect.outputs.present == 'true'
        run: python -m pytest

  backend-ruff:
    name: Backend / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ruff config (pyproject.toml) may not be merged yet; skip (green) until it exists.
      - name: Detect ruff config
        id: detect
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "dir=backend" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] && grep -q '^\[tool\.ruff' pyproject.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ruff skipped::no pyproject.toml with ruff config found"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install ruff
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f backend/requirements-dev.txt ] && grep -qiE '^ruff([^a-z0-9_-]|$)' backend/requirements-dev.txt; then
            python -m pip install "$(grep -iE '^ruff([^a-z0-9_-]|$)' backend/requirements-dev.txt | head -n1)"
          else
            python -m pip install ruff
          fi

      - name: Run ruff check
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: ruff check --output-format=github .

  frontend:
    name: Frontend / tsc + eslint + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is out of sync with the "sharp" override in package.json, so `npm ci` fails.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      # Non-blocking: main currently has pre-existing ESLint errors. Remove continue-on-error once clean.
      - name: Lint (eslint)
        continue-on-error: true
        run: npx eslint .

      # vitest may not be merged yet; skip until it is a dependency in package.json.
      - name: Detect vitest
        id: vitest
        run: |
          if node -e 'const p=require("./package.json");process.exit({...p.dependencies,...p.devDependencies}.vitest?0:1)'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=vitest skipped::vitest not found in frontend/package.json"
          fi

      - name: Unit tests (vitest)
        if: steps.vitest.outputs.present == 'true'
        run: npx vitest run
